</div>

<p class="mt-1 text-[14px] font-black" id="modalTime">13:43</p>
</div>

<script>
    const mapRoute = document.querySelector('#routeBase');
    const progressCase = document.getElementById('progressCase');
    const progressRoute = document.getElementById('progressRoute');
    const runnerMarker = document.getElementById('runnerMarker');
    const routeLength = mapRoute.getTotalLength();

    const state = {
      running: true,
      seconds: 823,
      distance: 2.41,
      calories: 173,
      steps: 3360,
      progress: 0.42
    };

    function formatTime(totalSeconds) {
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      return [hours, minutes, seconds].map((value) => String(value).padStart(2, '0')).join(':');
    }

    function formatPace(totalSeconds, distance) {
      if (!distance) return '--\'--"';
      const paceSeconds = Math.round(totalSeconds / distance);
      const minutes = Math.floor(paceSeconds / 60);
      const seconds = paceSeconds % 60;
      return minutes + '\'' + String(seconds).padStart(2, '0') + '"';
    }

    function setRouteProgress(progress) {
      const clippedProgress = Math.min(Math.max(progress, 0), 0.98);
      progressCase.style.strokeDasharray = (routeLength * clippedProgress) + ' ' + routeLength;
      progressRoute.style.strokeDasharray = (routeLength * clippedProgress) + ' ' + routeLength;
      const point = mapRoute.getPointAtLength(routeLength * clippedProgress);
      runnerMarker.setAttribute('transform', 'translate(' + point.x + ' ' + point.y + ')');
    }

    function updateMetrics() {
      const distanceText = state.distance.toFixed(2);
      const paceText = formatPace(state.seconds, state.distance);
      const timeText = formatTime(state.seconds);
      document.getElementById('distanceValue').textContent = distanceText;
      document.getElementById('timeValue').textContent = timeText;
      document.getElementById('paceValue').textContent = paceText;
      document.getElementById('calorieValue').textContent = Math.round(state.calories);
      document.getElementById('goalBar').style.width = Math.min((state.distance / 5) * 100, 100) + '%';
      document.getElementById('modalDistance').textContent = distanceText;
      document.getElementById('modalTime').textContent = timeText;
      document.getElementById('modalPace').textContent = paceText;
    }

    setRouteProgress(state.progress);
    updateMetrics();

    const timer = window.setInterval(function () {
      if (!state.running) return;
      state.seconds += 1;
      state.distance += 0.00292;
      state.calories += 0.17;
      state.steps += 3;
      state.progress = Math.min(state.progress + 0.00004, 0.88);
      setRouteProgress(state.progress);
      updateMetrics();
    }, 1000);

    const pauseButton = document.getElementById('pauseButton');
    const pauseIcon = document.getElementById('pauseIcon');
    const playIcon = document.getElementById('playIcon');
    const pauseLabel = document.getElementById('pauseLabel');
    const liveDot = document.getElementById('liveDot');
    const liveStatus = document.getElementById('liveStatus');

    pauseButton.addEventListener('click', function () {
      state.running = !state.running;
      if (state.running) {
        pauseIcon.classList.remove('hidden');
        playIcon.classList.add('hidden');
        pauseLabel.textContent = '暂停';
        pauseButton.setAttribute('aria-label', '暂停跑步');
        liveDot.classList.remove('bg-[#854F0B]');
        liveDot.classList.add('bg-[#EF9F27]');
        liveStatus.textContent = '实时记录中';
      } else {
        pauseIcon.classList.add('hidden');
        playIcon.classList.remove('hidden');
        pauseLabel.textContent = '继续';
        pauseButton.setAttribute('aria-label', '继续跑步');
        liveDot.classList.remove('bg-[#EF9F27]');
        liveDot.classList.add('bg-[#854F0B]');
        liveStatus.textContent = '已暂停';
      }
    });

    const endModal = document.getElementById('endModal');
    document.getElementById('endButton').addEventListener('click', function () {
      updateMetrics();
      endModal.classList.remove('hidden');
      endModal.classList.add('flex');
    });

    document.getElementById('cancelEnd').addEventListener('click', function () {
      endModal.classList.add('hidden');
      endModal.classList.remove('flex');
    });

    document.getElementById('confirmEnd').addEventListener('click', function () {
      const summary = {
        distance: state.distance.toFixed(2),
        seconds: state.seconds,
        timeText: formatTime(state.seconds),
        pace: formatPace(state.seconds, state.distance),
        calories: Math.round(state.calories),
        steps: state.steps,
        progress: state.progress
      };
      try {
        sessionStorage.setItem('runSummary', JSON.stringify(summary));
      } catch (error) {
        console.log('Summary storage unavailable');
      }
      window.location.href = 'run-result.html';
    });
  </script>
